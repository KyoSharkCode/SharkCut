name: Compilación

on:
  push:
    branches: [main, "claude/**"]
    # Una etiqueta vX.Y.Z publica esa versión (GitHub Releases): instalador y .zip.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.10.3"
  # Código fuente que se publica con cada versión (la GPL lo exige por la compilación de
  # FFmpeg de cmake/FFmpeg.cmake, que incluye x264). Cambiarlos a la vez que esa compilación.
  FFMPEG_SOURCE_VERSION: "9.0.2"
  FFMPEG_SOURCE_SHA256: "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
  X264_COMMIT: "0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee"

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    permissions:
      contents: write # publicar la versión (solo con una etiqueta v*)
    env:
      # Firma con SignPath (docs/FIRMA.md): solo se firma si están configuradas estas
      # variables del repositorio y el secreto SIGNPATH_API_TOKEN.
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtshadertools
          aqtversion: "==3.3.*"
          cache: true

      - name: Entorno de MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # FFmpeg precompilado (~60 MB): se guarda en caché entre ejecuciones.
      - name: Caché de FFmpeg
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/FFmpeg.cmake') }}

      - name: Configurar
        run: cmake --preset windows-release

      - name: Compilar
        run: cmake --build --preset windows-release

      - name: Tests
        run: ctest --preset windows-release

      - name: Empaquetar
        run: cmake --install build/windows-release --prefix "${{ github.workspace }}/dist/SharkCut"

      - name: Subir ejecutable
        id: ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: SharkCut-windows
          path: dist/SharkCut

      # Solo al publicar una versión y con SignPath configurado: firma bin/SharkCut.exe y
      # sustituye la carpeta por la firmada (el instalador y el .zip llevan la firmada).
      - name: Firmar el ejecutable
        id: firma-ejecutable
        if: github.ref_type == 'tag' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ejecutable
          github-artifact-id: ${{ steps.ejecutable.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/SharkCut-firmado

      - name: Usar el ejecutable firmado
        if: steps.firma-ejecutable.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist\SharkCut
          Move-Item dist\SharkCut-firmado dist\SharkCut

      # Versión del proyecto (CMakeLists.txt). Con una etiqueta, debe coincidir con ella.
      - name: Versión
        id: version
        shell: pwsh
        run: |
          $linea = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $version = $linea.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión del proyecto ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=${{ github.workspace }}\dist\SharkCut" `
            "/DOutputDir=${{ github.workspace }}\dist" installer\SharkCut.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló ($LASTEXITCODE)" }
          Compress-Archive -Path dist\SharkCut -DestinationPath "dist\SharkCut-${{ steps.version.outputs.version }}-Windows.zip"

      - name: Subir instalador
        id: instalador
        uses: actions/upload-artifact@v4
        with:
          name: SharkCut-instalador
          path: dist/SharkCut-*-Setup.exe

      - name: Firmar el instalador
        id: firma-instalador
        if: github.ref_type == 'tag' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/instalador-firmado

      - name: Usar el instalador firmado
        if: steps.firma-instalador.outcome == 'success'
        shell: pwsh
        run: Move-Item -Force dist\instalador-firmado\SharkCut-*-Setup.exe dist\

      # Solo con una etiqueta v*: el código fuente de FFmpeg y de x264 que exige la GPL
      # (licenses/LEEME.md). FFmpeg, comprobado con su SHA-256; x264, por su commit.
      - name: Código fuente de FFmpeg
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ffmpeg = "dist\ffmpeg-$env:FFMPEG_SOURCE_VERSION.tar.xz"
          Invoke-WebRequest "https://ffmpeg.org/releases/ffmpeg-$env:FFMPEG_SOURCE_VERSION.tar.xz" -OutFile $ffmpeg
          $hash = (Get-FileHash $ffmpeg -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SOURCE_SHA256) { throw "El SHA-256 de $ffmpeg no coincide ($hash)" }
          $corto = $env:X264_COMMIT.Substring(0, 8)
          git init -q x264
          git -C x264 fetch -q --depth 1 https://code.videolan.org/videolan/x264.git $env:X264_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "No se pudo descargar x264" }
          git -C x264 archive --format=tar.gz --prefix="x264-$corto/" -o "..\dist\x264-$corto.tar.gz" FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "No se pudo empaquetar x264" }

      # Solo con una etiqueta v*: la versión en GitHub Releases, con sus novedades
      # (docs/novedades/<versión>.md). SharkCut y la página de descarga la buscan ahí.
      - name: Publicar la versión
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SharkCut ${{ steps.version.outputs.version }}
          body_path: docs/novedades/${{ steps.version.outputs.version }}.md
          files: |
            dist/SharkCut-${{ steps.version.outputs.version }}-Setup.exe
            dist/SharkCut-${{ steps.version.outputs.version }}-Windows.zip
            dist/ffmpeg-*.tar.xz
            dist/x264-*.tar.gz

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libxkbcommon-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtshadertools
          aqtversion: "==3.3.*"
          cache: true

      - name: Configurar
        run: cmake --preset linux-release

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Tests
        run: ctest --preset linux-release
