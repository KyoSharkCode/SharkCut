name: Compilación

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.10.3"

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtshadertools
          aqtversion: "==3.3.*"
          cache: true

      - name: Entorno de MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar
        run: cmake --preset windows-release

      - name: Compilar
        run: cmake --build --preset windows-release

      - name: Tests
        run: ctest --preset windows-release

      - name: Empaquetar
        run: cmake --install build/windows-release --prefix "${{ github.workspace }}/dist/SharkCut"

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: SharkCut-windows
          path: dist/SharkCut

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtshadertools
          aqtversion: "==3.3.*"
          cache: true

      - name: Configurar
        run: cmake --preset linux-release

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Tests
        run: ctest --preset linux-release
